name: Android Build

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-debug-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            android-debug-gradle-

      - name: Build Android debug APK
        run: |
          set +e
          ./gradlew :android:app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          {
            echo '## androidx.core 解析结果'
            echo '````'
            ./gradlew :android:app:dependencies --configuration debugCompileClasspath 2>/dev/null | grep -i 'androidx.core' | sort -u || echo 'no match'
            echo '````'
            echo '## Kotlin 错误行'
            echo '````'
            grep -E '^e: ' build.log | head -80 || echo 'none'
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Show built apks
        run: find android/app/build/outputs -name '*.apk' -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abdm-android-debug
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
